name: seal-build

# Builds kotlin-stdlib (jar + modular jar) with the repository's own Gradle 6.0.1
# wrapper and runs the kotlin-stdlib `check` suite (test, coroutinesExperimentalTest,
# coroutinesExperimentalMigrationTest). Upstream has no GitHub Actions CI; Kotlin
# 1.3.72 was built on JetBrains TeamCity with JDK_16/JDK_17/JDK_18/JDK_9 configured.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional Gradle test selector (e.g. ':kotlin-stdlib:test --tests test.io.FilesTest'); empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Configure only kotlin-stdlib and its test dependencies (see settings.gradle).
      KOTLIN_BUILD_STDLIB_ONLY: "true"
      # buildSrc/prepare-deps downloads the IntelliJ SDK snapshot, which no longer exists.
      KOTLIN_BUILD_SKIP_PREPARE_DEPS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 (Gradle runtime, JDK_18)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install JDK 6, JDK 7 and OpenJDK 9.0.4
        run: |
          set -euo pipefail
          mkdir -p "$HOME/jdks" && cd "$HOME/jdks"
          curl -fsSL https://cdn.azul.com/zulu/bin/zulu6.22.0.3-ca-jdk6.0.119-linux_x64.tar.gz | tar xz
          curl -fsSL https://cdn.azul.com/zulu/bin/zulu7.56.0.11-ca-jdk7.0.352-linux_x64.tar.gz | tar xz
          # The release's module-info.class records the compiling JDK as 9.0.4.
          curl -fsSL https://download.java.net/java/GA/jdk9/9.0.4/binaries/openjdk-9.0.4_linux-x64_bin.tar.gz | tar xz
          echo "JDK_16=$HOME/jdks/zulu6.22.0.3-jdk6.0.119-linux_x64" >> "$GITHUB_ENV"
          echo "JDK_17=$HOME/jdks/zulu7.56.0.11-ca-jdk7.0.352-linux_x64" >> "$GITHUB_ENV"
          echo "JDK_18=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "JDK_9=$HOME/jdks/jdk-9.0.4" >> "$GITHUB_ENV"

      - name: Print JDKs
        run: |
          "$JDK_16/bin/java" -version
          "$JDK_17/bin/java" -version
          "$JDK_18/bin/java" -version
          "$JDK_9/bin/java" -version

      - name: Gradle init script (test result logging)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/test-logging.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events "passed", "skipped", "failed"
                      exceptionFormat "full"
                  }
                  afterSuite { desc, result ->
                      if (!desc.parent) {
                          println "TEST SUMMARY ${path}: ${result.resultType} - ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
                      }
                  }
              }
          }
          EOF

      - name: Build and test kotlin-stdlib
        run: |
          set -euo pipefail
          # The pinned bootstrap (1.3.70-eap-145) lived on the retired Bintray
          # kotlin-bootstrap repo; the 1.3.70 release from Maven Central is used instead.
          GRADLE_ARGS=(--no-daemon --stacktrace
            -Pbootstrap.kotlin.version=1.3.70
            -Pbootstrap.kotlin.repo=https://repo1.maven.org/maven2
            "-Pbuild.number=1.3.72-release-468 (1.3.72)"
            -PdeployVersion=1.3.72)
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew "${GRADLE_ARGS[@]}" :kotlin-stdlib:jar :kotlin-stdlib:modularJar ${{ inputs.test-filter }}
          else
            ./gradlew "${GRADLE_ARGS[@]}" :kotlin-stdlib:jar :kotlin-stdlib:modularJar :kotlin-stdlib:check
          fi

      - name: Test report summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET
          sources = glob.glob("libraries/stdlib/**/test/**/*.kt", recursive=True)

          def skip_reason(name):
              # JUnit XML carries no message for @Ignore: quote the annotation and the
              # comment above it straight from the test source.
              for src in sources:
                  lines = open(src, encoding="utf-8").read().splitlines()
                  for i, line in enumerate(lines):
                      if re.search(r"\bfun\s+%s\s*\(" % re.escape(name), line):
                          ctx = [l.strip() for l in lines[max(0, i - 4):i] if l.strip()]
                          return "%s:%d -> %s" % (src, i + 1, " | ".join(ctx))
              return "source not found"

          grand = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for task_dir in sorted(glob.glob("libraries/stdlib/jvm/build/test-results/*/")):
              tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for p in sorted(glob.glob(os.path.join(task_dir, "*.xml"))):
                  r = ET.parse(p).getroot()
                  for k in tot:
                      tot[k] += int(r.get(k, 0))
                  for tc in r.findall("testcase"):
                      if tc.find("skipped") is not None:
                          print("SKIPPED %s.%s (@Ignore in source): %s"
                                % (tc.get("classname"), tc.get("name"), skip_reason(tc.get("name"))))
              passed = tot["tests"] - tot["failures"] - tot["errors"] - tot["skipped"]
              print("Gradle test task :kotlin-stdlib:%s -> %d tests, %d passed, %d failures, %d errors, %d skipped"
                    % (os.path.basename(task_dir.rstrip("/")), tot["tests"], passed,
                       tot["failures"], tot["errors"], tot["skipped"]))
              for k in grand:
                  grand[k] += tot[k]
          passed = grand["tests"] - grand["failures"] - grand["errors"] - grand["skipped"]
          print("kotlin-stdlib check, all test tasks combined: %d tests, %d passed, %d failures, %d errors, %d skipped"
                % (grand["tests"], passed, grand["failures"], grand["errors"], grand["skipped"]))
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-stdlib-jars
          path: |
            libraries/stdlib/jvm/build/libs/kotlin-stdlib-1.3.72.jar
            libraries/stdlib/jvm/build/libs/kotlin-stdlib-1.3.72-modular.jar
          if-no-files-found: error
